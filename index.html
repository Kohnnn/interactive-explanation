<!doctype html>
<html lang="en">
<head>
  <meta property="og:url" content="https://kohnnn.github.io/interactive-explanation/">
  <link rel="canonical" href="https://kohnnn.github.io/interactive-explanation/">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Interactive Explanation Atlas</title>
  <meta name="description" content="Interactive ways to understand, practice, experiment, and build.">
  <link rel="icon" type="image/png" href="./favicon.png">
  <link rel="stylesheet" href="./shared/site.css">
  <link rel="stylesheet" href="./shared/public-footer.css">
</head>
<body data-page-type="home">
  <main class="site-page">
    <section class="hero hero--atlas">
      <p class="eyebrow">Interactive Explanation Atlas</p>
      <h1>Understand, practice, experiment, and build.</h1>
      <p class="lead">Find an interactive route for the question, skill, or idea in front of you.</p>
      <a class="action-link" href="#route-inventory">Browse all routes</a>
    </section>

    <section class="inventory-section" id="route-inventory">
      <div class="section-heading">
        <div>
          <p class="eyebrow">Route inventory</p>
          <h2>Choose a way in</h2>
        </div>
        <p class="meta-line" data-page-results aria-live="polite">Loading routes...</p>
      </div>

      <div class="inventory-toolbar" data-atlas-controls>
        <label class="search-field">
          <span class="search-field__label">Search</span>
          <input type="search" placeholder="Title, topic, source, or route" autocomplete="off" data-filter-query>
        </label>

        <div class="control-row">
          <div class="filter-group">
            <span class="filter-group__label">I want to</span>
            <div class="filter-pills" data-intent-filters>
              <button class="filter-pill is-active" type="button" data-atlas-intent="all" aria-pressed="true">All</button>
              <button class="filter-pill" type="button" data-atlas-intent="explainer" aria-pressed="false">Understand</button>
              <button class="filter-pill" type="button" data-atlas-intent="simulation" aria-pressed="false">Experiment</button>
              <button class="filter-pill" type="button" data-atlas-intent="practice" aria-pressed="false">Practice</button>
              <button class="filter-pill" type="button" data-atlas-intent="create" aria-pressed="false">Build</button>
              <button class="filter-pill" type="button" data-atlas-intent="guided-path" aria-pressed="false">Follow a path</button>
            </div>
          </div>
          <label class="select-field">
            <span class="filter-group__label">Sort</span>
            <select data-sort-select>
              <option value="featured">Featured</option>
              <option value="new">Newest</option>
              <option value="title">Title A–Z</option>
            </select>
          </label>
        </div>

        <details class="advanced-filters">
          <summary>Advanced: source family</summary>
          <div class="filter-pills" data-family-filters></div>
        </details>

        <button class="action-link secondary action-link--button" type="button" data-clear-filters hidden disabled>Clear filters</button>
      </div>

      <section class="page-grid page-grid--inventory" data-page-list>
        <div class="empty-state">Loading route inventory...</div>
      </section>
    </section>
  </main>

  <script src="./shared/route-families.js"></script>
  <script src="./shared/site.js"></script>
  <script src="./shared/public-footer.js"></script>
</body>
</html>
