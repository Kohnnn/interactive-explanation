      <script>
        document.addEventListener("DOMContentLoaded", function () {
          const app = document.getElementById("app");
          if (!app) {
            return;
          }

          function prunePromoSurfaces() {
            for (const node of Array.from(app.children)) {
              if (node.textContent?.trim() === "Made in love by Piko and blinry for 37C3") {
                node.remove();
              }
            }

            for (const heading of Array.from(app.querySelectorAll("h2"))) {
              if (heading.textContent?.trim() !== "Found a bug? Feature request?") {
                continue;
              }
              const next = heading.nextElementSibling;
              heading.remove();
              if (next?.tagName === "P") {
                next.remove();
              }
            }
          }

            prunePromoSurfaces();
            if (app.children.length) {
              app.setAttribute("aria-busy", "false");
            }
            new MutationObserver(function () {
              prunePromoSurfaces();
              if (app.children.length) {
                app.setAttribute("aria-busy", "false");
              }
            }).observe(app, { childList: true, subtree: true });
        });
      </script>
        <script defer src="../shared/engineering-sandbox.js"></script>
