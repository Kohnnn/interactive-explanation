name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Verify
        run: npm test

      - name: Manifest drift gate
        run: git diff --exit-code pages.json

      - name: Migrated Ncase smoke subset
        run: node tools/smoke-bundle.mjs . --route trust --route crowds --route loopy --route anxiety --route wbwwb --route coming-out-simulator-2014 --route sim

      - name: Formula 1 smoke
        run: node tools/smoke-bundle.mjs . --route formula-1-racing

  full-smoke:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Full smoke
        run: node tools/smoke-bundle.mjs .
