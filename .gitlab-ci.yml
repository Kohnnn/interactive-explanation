image: node:22-bookworm

variables:
  GIT_DEPTH: "0"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

pages:
  resource_group: pages
  script:
    - npm ci --prefer-offline
    - npm test
    - git diff --exit-code
    - node tools/package-pages.mjs . public
  pages:
    publish: public
    expire_in: never
  artifacts:
    paths:
      - public
  environment:
    name: gitlab-pages
    url: $CI_PAGES_URL
